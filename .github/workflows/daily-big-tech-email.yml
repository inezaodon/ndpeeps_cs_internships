name: Daily internship digest

on:
  schedule:
    # Fresh pull from both internship repos + email digest.
    # ~9:00 AM America/New_York (13:00 UTC during EDT)
    - cron: "0 13 * * *"
    # ~6:00 PM America/New_York (22:00 UTC during EDT) — catches afternoon posts
    - cron: "0 22 * * *"
  workflow_dispatch:

jobs:
  send-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Pull listings and send digest email
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_TO: inezaodon1@gmail.com,oineza@nd.edu
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          DIGEST_TIMEZONE: America/New_York
        run: node scripts/daily-big-tech-email.mjs
